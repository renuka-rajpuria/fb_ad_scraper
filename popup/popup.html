<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ad Trace</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Ad Trace</h1>
    <p class="subtext">Get the URL from <a href="https://www.facebook.com/ads/library/" target="_blank">Facebook Ad Library</a></p>
    <input type="text" id="url-input" placeholder="Paste Facebook Ad Library URL" />
    <label class="toggle-label">
      <input type="checkbox" id="active-only" checked />
      Active ads only
    </label>
    <button id="scrape-btn">Scrape</button>
    <p id="error-msg" class="error-msg"></p>

    <div id="status-box" class="status-box hidden">
      <div id="progress-bar-wrap">
        <div id="progress-bar"></div>
      </div>
      <p id="status-text">Scraping in progress... loading ads.</p>
    </div>

    <div id="results-box" class="results-box hidden">
      <p id="results-summary"></p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
